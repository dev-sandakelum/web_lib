<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiz Demo — Hasitha Sandakelum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --border:    #30363d;
  --text:      #e6edf3;
  --muted:     #8b949e;
  --green:     #10b981;
  --green-dim: rgba(16,185,129,.15);
  --green-bdr: rgba(16,185,129,.35);
  --teal:      #14b8a6;
  --red:       #f87171;
  --red-dim:   rgba(248,113,113,.12);
  --amber:     #fbbf24;
  --amber-dim: rgba(251,191,36,.12);
  --purple:    #a78bfa;
  --blue:      #60a5fa;
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
.app { max-width: 900px; margin: 0 auto; }

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(12px);
  background: rgba(13,17,23,.85);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-icon {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, #7c3aed, #2563eb);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(124,58,237,.3);
}
.header-icon svg { width: 22px; height: 22px; color: #fff; }
.header-title { font-size: 20px; font-weight: 800; }
.header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.sem-badge {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 999px;
  background: rgba(16,185,129,.08);
  border: 1px solid rgba(16,185,129,.25);
  font-size: 12px; font-weight: 600; color: #6ee7b7;
  white-space: nowrap;
}
.sem-badge svg { width: 14px; height: 14px; }

/* ── Search ── */
.search-bar {
  padding: 14px 20px;
  border-bottom: 1px solid rgba(48,54,61,.5);
}
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search-wrap input {
  width: 100%; padding: 10px 14px 10px 40px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; font-size: 14px; color: var(--text);
  font-family: inherit; outline: none; transition: border .2s, box-shadow .2s;
}
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }

/* ── Browse ── */
.browse { padding: 20px; }
.section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.section-head svg { width: 18px; height: 18px; }
.section-title { font-size: 20px; font-weight: 800; }
.badge-current {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--green); background: rgba(16,185,129,.1);
  padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(16,185,129,.2);
}
.badge-archive {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--muted); background: rgba(255,255,255,.05);
  padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1);
}

/* pills */
.pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex-shrink: 0; padding: 6px 14px; border-radius: 999px;
  font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted);
  transition: all .2s; white-space: nowrap;
}
.pill.active { background: linear-gradient(135deg,#059669,#0d9488); color: #fff; border-color: transparent; box-shadow: 0 2px 10px rgba(5,150,105,.3); }
.pill:hover:not(.active) { border-color: rgba(16,185,129,.4); color: var(--text); }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 16px; }

/* card */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px;
  display: flex; flex-direction: column; min-height: 180px;
  transition: transform .25s, border-color .25s, box-shadow .25s;
  cursor: pointer;
}
.card:hover { transform: translateY(-3px); }
.card.current:hover { border-color: rgba(16,185,129,.6); box-shadow: 0 0 28px -8px rgba(16,185,129,.3); }
.card.archive:hover { border-color: rgba(167,139,250,.5); box-shadow: 0 0 28px -8px rgba(167,139,250,.25); }
.card-title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.45; margin-bottom: 6px; flex: 1; }
.card.current:hover .card-title { color: #6ee7b7; }
.card.archive:hover .card-title { color: var(--purple); }
.card-cat { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.card-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 14px; }
.card-meta svg { width: 14px; height: 14px; color: var(--green); }
.btn-start {
  width: 100%; padding: 10px; border-radius: 12px; border: none; cursor: pointer;
  background: linear-gradient(135deg,#059669,#0d9488);
  color: #fff; font-size: 13px; font-weight: 700; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .2s; box-shadow: 0 4px 14px rgba(5,150,105,.25);
}
.btn-start:hover { background: linear-gradient(135deg,#10b981,#14b8a6); }
.btn-start svg { width: 14px; height: 14px; }

/* ── Archive section gap ── */
.archive-section { margin-top: 32px; }

/* ── Quiz Screen ── */
.quiz-screen { padding: 20px; display: none; flex-direction: column; gap: 16px; }

.quiz-progress-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.quiz-progress-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-counter {
  flex-shrink: 0; font-size: 12px; font-weight: 700;
  padding: 4px 12px; border-radius: 999px;
  background: rgba(16,185,129,.1); color: #6ee7b7;
  border: 1px solid rgba(16,185,129,.3);
}
.progress-bar-wrap {
  width: 100%; height: 10px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--green), var(--teal));
  transition: width .5s ease;
}
.progress-hint { font-size: 12px; color: var(--muted); font-weight: 500; }

/* question card */
.q-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 24px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,.3);
}
.q-text { font-size: 18px; font-weight: 700; line-height: 1.55; margin-bottom: 24px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  width: 100%; text-align: left; padding: 14px 16px;
  border-radius: 12px; border: 2px solid var(--border);
  background: var(--bg); color: var(--text);
  font-size: 14px; font-weight: 600; font-family: inherit;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; transition: all .2s;
}
.opt-btn:hover:not(:disabled) { border-color: rgba(16,185,129,.5); background: rgba(16,185,129,.04); }
.opt-btn:disabled { cursor: not-allowed; }
.opt-btn.correct { background: rgba(16,185,129,.12); border-color: var(--green); color: #6ee7b7; }
.opt-btn.wrong   { background: rgba(248,113,113,.12); border-color: var(--red); color: #fca5a5; }
.opt-btn.dim     { opacity: .45; }
.opt-letter {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 8px;
  background: #21262d; border: 1px solid var(--border);
  color: var(--muted); font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* quiz actions */
.quiz-actions { display: flex; gap: 10px; padding-top: 8px; }
.btn-next, .btn-finish {
  flex: 1; padding: 12px; border-radius: 12px; border: none;
  font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .2s;
}
.btn-next {
  background: linear-gradient(135deg,#059669,#0d9488); color: #fff;
  box-shadow: 0 4px 14px rgba(5,150,105,.25);
}
.btn-next:hover { background: linear-gradient(135deg,#10b981,#14b8a6); }
.btn-finish {
  background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35);
  color: var(--red);
}
.btn-finish:hover { background: rgba(248,113,113,.2); }
.btn-next svg, .btn-finish svg { width: 16px; height: 16px; }

/* ── Results Screen ── */
.results-screen { padding: 20px; display: none; flex-direction: column; gap: 16px; }

.results-header { text-align: center; padding: 8px 0 12px; }
.results-icon {
  width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 12px;
  background: linear-gradient(135deg,rgba(16,185,129,.2),rgba(20,184,166,.2));
  border: 1px solid rgba(16,185,129,.35);
  display: flex; align-items: center; justify-content: center;
}
.results-icon svg { width: 32px; height: 32px; color: var(--green); }
.results-heading {
  font-size: 28px; font-weight: 800;
  background: linear-gradient(135deg, var(--green), var(--teal));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.score-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.score-card {
  border-radius: 14px; padding: 14px 10px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.score-card.correct { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); }
.score-card.wrong   { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.3); }
.score-card.skipped { background: rgba(251,191,36,.10); border: 1px solid rgba(251,191,36,.3); }
.score-card svg { width: 20px; height: 20px; }
.score-card.correct svg { color: var(--green); }
.score-card.wrong svg   { color: var(--red); }
.score-card.skipped svg { color: var(--amber); }
.score-num { font-size: 26px; font-weight: 800; }
.score-card.correct .score-num { color: var(--green); }
.score-card.wrong .score-num   { color: var(--red); }
.score-card.skipped .score-num { color: var(--amber); }
.score-lbl { font-size: 11px; font-weight: 600; color: var(--muted); }

.final-score-box {
  background: var(--surface); border: 1px solid rgba(16,185,129,.3);
  border-radius: 16px; padding: 20px; text-align: center;
}
.final-pct {
  font-size: 56px; font-weight: 800;
  background: linear-gradient(135deg, var(--green), var(--teal));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  line-height: 1;
}
.final-pct-label { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 500; }

.insight-box {
  background: linear-gradient(135deg,rgba(96,165,250,.08),rgba(34,211,238,.08));
  border: 1px solid rgba(96,165,250,.25); border-radius: 16px; padding: 16px;
  display: flex; align-items: flex-start; gap: 10px;
}
.insight-box svg { width: 18px; height: 18px; color: var(--blue); flex-shrink: 0; margin-top: 2px; }
.insight-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.insight-text { font-size: 12px; color: #cbd5e1; line-height: 1.6; }

/* review filters */
.review-filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.review-filters::-webkit-scrollbar { display: none; }
.review-pill {
  flex-shrink: 0; padding: 7px 14px; border-radius: 999px;
  font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); transition: all .2s;
}
.review-pill.active { background: linear-gradient(135deg,#059669,#0d9488); color: #fff; border-color: transparent; }

/* review list */
.review-list {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px; max-height: 380px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
  scrollbar-width: thin; scrollbar-color: rgba(16,185,129,.25) transparent;
}
.review-item {
  border-radius: 12px; padding: 14px; border: 1px solid var(--border);
  display: flex; gap: 12px; background: rgba(255,255,255,.02);
}
.review-item.correct { background: rgba(16,185,129,.08); border-color: rgba(16,185,129,.25); }
.review-item.wrong   { background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.25); }
.review-badge {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
}
.review-badge.correct { background: var(--green); color: #fff; }
.review-badge.wrong   { background: var(--red); color: #fff; }
.review-badge.skip    { background: #374151; color: #9ca3af; }
.review-q { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.review-ans { font-size: 11.5px; }
.review-ans .yours { color: #fca5a5; margin-bottom: 2px; }
.review-ans .correct-ans { color: #6ee7b7; }
.review-ans .skipped-note { color: var(--muted); font-style: italic; }

/* result actions */
.result-actions { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.btn-retry {
  width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
  background: linear-gradient(135deg,#059669,#0d9488); color: #fff;
  font-size: 14px; font-weight: 700; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 16px rgba(5,150,105,.3); transition: all .2s;
}
.btn-retry:hover { background: linear-gradient(135deg,#10b981,#14b8a6); }
.btn-back {
  width: 100%; padding: 14px; border-radius: 12px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 14px; font-weight: 700; font-family: inherit;
  transition: all .2s;
}
.btn-back:hover { background: #1f2937; }
.btn-retry svg, .btn-back svg { width: 16px; height: 16px; }

/* ── Responsive ── */
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr 1fr; }
  .q-text { font-size: 15px; }
  .final-pct { font-size: 42px; }
  .header-title { font-size: 17px; }
  .sem-badge { display: none; }
}
@media (max-width: 380px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="header-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      </div>
      <div>
        <div class="header-title">Quizzes</div>
        <div class="header-sub">Learn &amp; test your knowledge</div>
      </div>
    </div>
    <div class="sem-badge">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5"/></svg>
      Year 2 · Semester 1
    </div>
  </header>

  <!-- Search -->
  <div class="search-bar" id="search-bar">
    <div class="search-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Search quizzes…" oninput="filterQuizzes()"/>
    </div>
  </div>

  <!-- Browse -->
  <div class="browse" id="browse-screen">

    <!-- Current Semester -->
    <div>
      <div class="section-head">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:#10b981"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
        <span class="section-title">Year 2 · Semester 1</span>
        <span class="badge-current">Current</span>
      </div>
      <div class="pills" id="current-pills"></div>
      <div class="grid" id="current-grid"></div>
    </div>

    <!-- Archive -->
    <div class="archive-section">
      <div class="section-head">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:#8b949e"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
        <span class="section-title" style="color:#cbd5e1">Year 1 · Semester 2</span>
        <span class="badge-archive">Archive</span>
      </div>
      <div class="pills" id="archive-pills"></div>
      <div class="grid" id="archive-grid"></div>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div class="quiz-screen" id="quiz-screen">
    <div class="quiz-progress-head">
      <div class="quiz-progress-title" id="quiz-title"></div>
      <div class="q-counter" id="q-counter"></div>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-hint" id="progress-hint"></div>

    <div class="q-card">
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
    </div>

    <div class="quiz-actions">
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
        Skip
      </button>
      <button class="btn-finish" id="btn-finish" onclick="finishQuiz()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 7.5A2.25 2.25 0 017.5 5.25h9a2.25 2.25 0 012.25 2.25v9a2.25 2.25 0 01-2.25 2.25h-9a2.25 2.25 0 01-2.25-2.25v-9z"/></svg>
        Finish
      </button>
    </div>
  </div>

  <!-- Results Screen -->
  <div class="results-screen" id="results-screen">
    <div class="results-header">
      <div class="results-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 01-.982-3.172M9.497 14.25a7.454 7.454 0 00.981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 007.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 002.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 012.916.52 6.003 6.003 0 01-5.395 4.972m0 0a6.726 6.726 0 01-2.749 1.35m0 0a6.772 6.772 0 01-3.044 0"/></svg>
      </div>
      <div class="results-heading">Quiz Complete!</div>
    </div>

    <div class="score-cards">
      <div class="score-card correct">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <div class="score-num" id="res-correct">0</div>
        <div class="score-lbl">Correct</div>
      </div>
      <div class="score-card wrong">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <div class="score-num" id="res-wrong">0</div>
        <div class="score-lbl">Incorrect</div>
      </div>
      <div class="score-card skipped">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 9.563C9 9.252 9.252 9 9.563 9h4.874c.311 0 .563.252.563.563v4.874c0 .311-.252.563-.563.563H9.564A.562.562 0 019 14.437V9.564z"/></svg>
        <div class="score-num" id="res-skipped">0</div>
        <div class="score-lbl">Skipped</div>
      </div>
    </div>

    <div class="final-score-box">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;">Your Final Score</div>
      <div class="final-pct" id="res-pct">0%</div>
      <div class="final-pct-label" id="res-pct-label"></div>
    </div>

    <div class="insight-box">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941"/></svg>
      <div>
        <div class="insight-title">Performance Insight</div>
        <div class="insight-text" id="insight-text"></div>
      </div>
    </div>

    <div class="review-filters" id="review-filters"></div>
    <div class="review-list" id="review-list"></div>

    <div class="result-actions">
      <button class="btn-retry" onclick="retryQuiz()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1012.728 0M12 3v9"/></svg>
        Retry Quiz
      </button>
      <button class="btn-back" onclick="backToBrowse()">Back to Quizzes</button>
    </div>
  </div>

</div>

<script>
// ── Quiz Data ─────────────────────────────────────────────────────────────────
const QUIZZES = [
  {
    id: "mis1",
    title: "Information Systems in Global Business Today — Lecture 01",
    category: "Management Information Systems",
    semester: "current",
    questions: [
      { question: "What is an Information System?", options: ["A computer network connecting multiple devices", "A set of interrelated components that collect, process, store and distribute information to support decision making", "A software application used only for data storage", "A physical device used to input data"], correctIndex: 1 },
      { question: "How many credits is the Management Information Systems course unit worth?", options: ["1", "2", "3", "4"], correctIndex: 1 },
      { question: "What percentage of the total grade does Continuous Assessment (CA) contribute?", options: ["20%", "30%", "40%", "50%"], correctIndex: 1 },
      { question: "Who are the authors of the textbook 'Management Information Systems: Managing the Digital Firm'?", options: ["K. C. Laudon, J. P. Laudon", "M. Porter, P. Drucker", "J. O'Brien, G. Marakas", "R. Kelly, S. Alter"], correctIndex: 0 },
      { question: "What is the minimum attendance requirement for eligibility in this course?", options: ["70%", "75%", "80%", "90%"], correctIndex: 2 },
      { question: "Besides supporting decision making, what else may information systems help managers and workers do?", options: ["Reduce employee headcount only", "Analyze problems, visualize complex subjects, and create new products", "Only automate payroll processing", "Replace all organizational structures"], correctIndex: 1 },
    ]
  },
  {
    id: "mis2",
    title: "Global E-Business and Collaboration — Lecture 02",
    category: "Management Information Systems",
    semester: "current",
    questions: [
      { question: "Which of the following best describes E-Business?", options: ["Selling products only through physical stores", "Using digital technology and the internet to execute major business processes", "Managing human resources electronically", "Designing software for internal use only"], correctIndex: 1 },
      { question: "What is the primary goal of a Supply Chain Management (SCM) system?", options: ["To manage customer relationships", "To coordinate activities with suppliers, distributors, and logistics partners", "To create employee schedules", "To generate sales reports"], correctIndex: 1 },
      { question: "Which system is used to support customer interactions and relationships?", options: ["ERP", "SCM", "CRM", "KMS"], correctIndex: 2 },
      { question: "What does ERP stand for?", options: ["Enterprise Resource Planning", "Electronic Revenue Processing", "External Reporting Portal", "Efficiency and Risk Planning"], correctIndex: 0 },
      { question: "Collaboration tools primarily help organisations to:", options: ["Reduce product prices", "Enable employees to work together on shared tasks regardless of location", "Manage supply chains automatically", "Process financial transactions faster"], correctIndex: 1 },
    ]
  },
  {
    id: "mis3",
    title: "Information Systems, Organisations and Strategy — Lecture 03",
    category: "Management Information Systems",
    semester: "current",
    questions: [
      { question: "According to Porter's Competitive Forces Model, which force considers the threat of cheaper alternatives to a product?", options: ["Rivalry among competitors", "Threat of new entrants", "Bargaining power of suppliers", "Threat of substitute products"], correctIndex: 3 },
      { question: "Which strategy involves producing products and services at the lowest possible cost?", options: ["Differentiation strategy", "Focus strategy", "Low-cost leadership strategy", "Niche strategy"], correctIndex: 2 },
      { question: "What is a Value Chain?", options: ["A series of activities that add value to a product or service", "A network of companies sharing resources", "A method of encrypting financial transactions", "A model for measuring customer satisfaction"], correctIndex: 0 },
      { question: "Which information system supports top-level executive decision-making with aggregated data?", options: ["TPS", "MIS", "DSS", "ESS"], correctIndex: 3 },
      { question: "The concept of 'switching costs' in competitive strategy refers to:", options: ["The cost of switching software vendors", "Costs incurred when a customer changes to a competitor's product", "Financial costs of changing employees", "The overhead of migrating data between databases"], correctIndex: 1 },
    ]
  },
  {
    id: "net1",
    title: "Computer Networks — Physical Layer",
    category: "Networking",
    semester: "archive",
    questions: [
      { question: "What is the function of the Physical Layer in the OSI model?", options: ["Routing data packets", "Transmission of raw bit streams over a physical medium", "Error detection and correction", "Session establishment"], correctIndex: 1 },
      { question: "Which transmission medium offers the highest bandwidth?", options: ["Coaxial cable", "Twisted pair", "Optical fibre", "Radio waves"], correctIndex: 2 },
      { question: "What does NIC stand for?", options: ["Network Interface Card", "Network Internal Component", "Node Internet Controller", "None of the above"], correctIndex: 0 },
      { question: "Which of the following is a wireless transmission medium?", options: ["Optical fibre", "Coaxial cable", "Microwave", "Twisted pair"], correctIndex: 2 },
    ]
  },
  {
    id: "net2",
    title: "Data Link & MAC Layer",
    category: "Networking",
    semester: "archive",
    questions: [
      { question: "What is the primary role of the Data Link Layer?", options: ["Routing between networks", "Reliable node-to-node delivery of frames", "Managing application sessions", "Encrypting data"], correctIndex: 1 },
      { question: "MAC stands for:", options: ["Media Access Control", "Memory Address Cache", "Multi-Access Channel", "Managed Application Component"], correctIndex: 0 },
      { question: "Which protocol is used to resolve IP addresses to MAC addresses?", options: ["DNS", "DHCP", "ARP", "FTP"], correctIndex: 2 },
    ]
  },
  {
    id: "ca1",
    title: "Computer Architecture — Introduction",
    category: "Computer Architecture",
    semester: "archive",
    questions: [
      { question: "What does ALU stand for?", options: ["Arithmetic Logic Unit", "Automated Load Unit", "Advanced Language Utility", "Array Logic Unit"], correctIndex: 0 },
      { question: "Which component stores the address of the next instruction to execute?", options: ["Stack Pointer", "Program Counter", "Accumulator", "Index Register"], correctIndex: 1 },
      { question: "Von Neumann architecture is characterised by:", options: ["Separate memory for instructions and data", "A single shared memory for both instructions and data", "No use of a CPU", "Multiple processors only"], correctIndex: 1 },
      { question: "What is cache memory?", options: ["Permanent storage for the OS", "Fast, small memory between CPU and RAM", "A type of hard disk", "Network-attached storage"], correctIndex: 1 },
    ]
  },
];

// ── State ─────────────────────────────────────────────────────────────────────
let activeQuiz = null;
let shuffled = [];
let currentQ = 0;
let userAnswers = [];
let answered = new Set();
let showFeedback = false;
let reviewFilter = "all";
let currentPill = "all";
let archivePill = "all";

// ── Helpers ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  ["browse-screen","quiz-screen","results-screen"].forEach(s => {
    const el = document.getElementById(s);
    el.style.display = "none";
  });
  document.getElementById("search-bar").style.display = id === "browse-screen" ? "block" : "none";
  const target = document.getElementById(id);
  target.style.display = "flex";
}

// ── Build Browse ──────────────────────────────────────────────────────────────
function buildPills(containerId, quizzes, selected, onPick) {
  const cats = ["all", ...new Set(quizzes.map(q => q.category))];
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = cats.map(c => `
    <div class="pill${c === selected ? " active" : ""}" onclick="(${onPick.toString()})('${c}')">${c === "all" ? "All Subjects" : c}</div>
  `).join("");
}

function buildGrid(containerId, quizzes, accent) {
  const wrap = document.getElementById(containerId);
  if (!quizzes.length) {
    wrap.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:8px 0">No quizzes match your search.</div>`;
    return;
  }
  wrap.innerHTML = quizzes.map(q => `
    <div class="card ${accent}" onclick="startQuiz('${q.id}')">
      <div class="card-title">${q.title}</div>
      <div class="card-cat">${q.category}</div>
      <div class="card-meta">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
        ${q.questions.length} Questions
      </div>
      <button class="btn-start" onclick="event.stopPropagation();startQuiz('${q.id}')">
        Start Quiz
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
      </button>
    </div>
  `).join("");
}

function filterQuizzes() {
  const term = document.getElementById("search-input").value.toLowerCase();
  const current = QUIZZES.filter(q => q.semester === "current" && q.title.toLowerCase().includes(term) && (currentPill === "all" || q.category === currentPill));
  const archive = QUIZZES.filter(q => q.semester === "archive" && q.title.toLowerCase().includes(term) && (archivePill === "all" || q.category === archivePill));
  buildGrid("current-grid", current, "current");
  buildGrid("archive-grid", archive, "archive");
}

function setCurrentPill(cat) {
  currentPill = cat;
  buildPills("current-pills", QUIZZES.filter(q => q.semester === "current"), currentPill, setCurrentPill);
  filterQuizzes();
}
function setArchivePill(cat) {
  archivePill = cat;
  buildPills("archive-pills", QUIZZES.filter(q => q.semester === "archive"), archivePill, setArchivePill);
  filterQuizzes();
}

// ── Quiz ──────────────────────────────────────────────────────────────────────
function startQuiz(id) {
  activeQuiz = QUIZZES.find(q => q.id === id);
  if (!activeQuiz) return;
  shuffled = shuffle(activeQuiz.questions);
  currentQ = 0;
  userAnswers = new Array(shuffled.length).fill(null);
  answered = new Set();
  showFeedback = false;
  renderQuestion();
  showScreen("quiz-screen");
}

function renderQuestion() {
  const q = shuffled[currentQ];
  document.getElementById("quiz-title").textContent = activeQuiz.title;
  document.getElementById("q-counter").textContent = `${currentQ + 1} / ${shuffled.length}`;
  document.getElementById("progress-fill").style.width = `${((currentQ + 1) / shuffled.length) * 100}%`;
  document.getElementById("progress-hint").textContent = `${answered.size} of ${shuffled.length} questions answered`;
  document.getElementById("q-text").textContent = q.question;

  const isAnswered = answered.has(currentQ);
  const opts = document.getElementById("options");
  opts.innerHTML = q.options.map((opt, i) => {
    let cls = "opt-btn";
    if (isAnswered && showFeedback) {
      if (i === q.correctIndex) cls += " correct";
      else if (i === userAnswers[currentQ]) cls += " wrong";
      else cls += " dim";
    } else if (isAnswered) {
      cls += " dim";
    }
    const letter = String.fromCharCode(65 + i);
    return `<button class="${cls}" onclick="handleAnswer(${i})" ${isAnswered ? "disabled" : ""}>
      <span class="opt-letter">${letter}</span>${opt}
    </button>`;
  }).join("");

  // Next / Skip button
  const btnNext = document.getElementById("btn-next");
  const isLast = currentQ === shuffled.length - 1;
  btnNext.innerHTML = isAnswered
    ? (isLast
        ? `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>See Results`
        : `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>Next`)
    : `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>Skip`;

  btnNext.onclick = isAnswered && isLast ? finishQuiz : nextQuestion;
}

function handleAnswer(idx) {
  if (answered.has(currentQ)) return;
  userAnswers[currentQ] = idx;
  answered.add(currentQ);
  showFeedback = true;
  renderQuestion();
  if (currentQ < shuffled.length - 1) {
    setTimeout(() => { currentQ++; showFeedback = false; renderQuestion(); }, 1800);
  }
}

function nextQuestion() {
  if (currentQ < shuffled.length - 1) { currentQ++; showFeedback = answered.has(currentQ); renderQuestion(); }
}

function finishQuiz() {
  let score = 0;
  userAnswers.forEach((ans, i) => { if (ans === shuffled[i].correctIndex) score++; });
  const skipped = shuffled.length - answered.size;
  const wrong = answered.size - score;
  const pct = answered.size > 0 ? Math.round((score / answered.size) * 100) : 0;

  document.getElementById("res-correct").textContent = score;
  document.getElementById("res-wrong").textContent = wrong;
  document.getElementById("res-skipped").textContent = skipped;
  document.getElementById("res-pct").textContent = pct + "%";
  document.getElementById("res-pct-label").textContent = `${score} out of ${answered.size} correct`;

  const insights = [
    [100, "Perfect score! 🎉 You've mastered this topic. Consider trying more advanced quizzes."],
    [80,  "Excellent work! You have a strong understanding. Review incorrect answers to achieve perfection."],
    [60,  "Good effort! You're on the right track. Focus on the topics you missed."],
    [40,  "Keep practising! Review the material and try again to improve."],
    [0,   "Don't give up! Review the correct answers and practise more."],
  ];
  const txt = answered.size === 0
    ? "You didn't answer any questions. Try again to test your knowledge!"
    : insights.find(([t]) => pct >= t)[1];
  document.getElementById("insight-text").textContent = txt;

  reviewFilter = "all";
  renderReviewFilters(score, wrong, skipped);
  renderReviewList();
  showScreen("results-screen");
}

function renderReviewFilters(correct, wrong, skipped) {
  const filters = [
    { id:"all",       label:"All",       count: shuffled.length },
    { id:"correct",   label:"Correct",   count: correct },
    { id:"incorrect", label:"Incorrect", count: wrong },
    { id:"skipped",   label:"Skipped",   count: skipped },
  ];
  document.getElementById("review-filters").innerHTML = filters.map(f =>
    `<div class="review-pill${reviewFilter === f.id ? " active" : ""}" onclick="setReviewFilter('${f.id}')">${f.label} <span style="opacity:.7;font-size:11px">(${f.count})</span></div>`
  ).join("");
}

function setReviewFilter(f) {
  reviewFilter = f;
  const score = userAnswers.filter((a,i) => a !== null && a === shuffled[i].correctIndex).length;
  const wrong = answered.size - score;
  const skipped = shuffled.length - answered.size;
  renderReviewFilters(score, wrong, skipped);
  renderReviewList();
}

function renderReviewList() {
  const items = shuffled.map((q, i) => {
    const ans = userAnswers[i];
    const isAns = ans !== null;
    const isCorrect = isAns && ans === q.correctIndex;
    return { q, i, ans, isAns, isCorrect };
  }).filter(({ isAns, isCorrect }) => {
    if (reviewFilter === "all") return true;
    if (reviewFilter === "correct") return isAns && isCorrect;
    if (reviewFilter === "incorrect") return isAns && !isCorrect;
    if (reviewFilter === "skipped") return !isAns;
    return true;
  });

  document.getElementById("review-list").innerHTML = items.map(({ q, i, ans, isAns, isCorrect }) => {
    const badgeCls = !isAns ? "skip" : isCorrect ? "correct" : "wrong";
    const badgeTxt = !isAns ? "?" : isCorrect ? "✓" : "✕";
    const itemCls = !isAns ? "" : isCorrect ? " correct" : " wrong";
    return `<div class="review-item${itemCls}">
      <div class="review-badge ${badgeCls}">${badgeTxt}</div>
      <div style="flex:1;min-width:0">
        <div class="review-q">${q.question}</div>
        <div class="review-ans">${
          !isAns
            ? `<div class="skipped-note">You didn't answer this question</div>`
            : `${!isCorrect ? `<div class="yours">Your answer: <strong>${q.options[ans]}</strong></div>` : ""}
               <div class="correct-ans">Correct: <strong>${q.options[q.correctIndex]}</strong></div>`
        }</div>
      </div>
    </div>`;
  }).join("") || `<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">No items in this category.</div>`;
}

function retryQuiz() { startQuiz(activeQuiz.id); }
function backToBrowse() {
  activeQuiz = null;
  showScreen("browse-screen");
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  buildPills("current-pills", QUIZZES.filter(q => q.semester === "current"), "all", setCurrentPill);
  buildPills("archive-pills", QUIZZES.filter(q => q.semester === "archive"), "all", setArchivePill);
  buildGrid("current-grid", QUIZZES.filter(q => q.semester === "current"), "current");
  buildGrid("archive-grid", QUIZZES.filter(q => q.semester === "archive"), "archive");
  showScreen("browse-screen");
})();
</script>
</body>
</html>
